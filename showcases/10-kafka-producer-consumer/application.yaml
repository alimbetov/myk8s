spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:event-bus-kafka-bootstrap:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notification-worker}
      enable-auto-commit: false
    producer:
      acks: all

app:
  topics:
    orders-created: ${ORDERS_CREATED_TOPIC:orders.created}
