apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: event-bus
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: event-bus
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders-created
  labels:
    strimzi.io/cluster: event-bus
spec:
  topicName: orders.created
  partitions: 6
  replicas: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-client-config
data:
  KAFKA_BOOTSTRAP_SERVERS: event-bus-kafka-bootstrap:9092
  ORDERS_CREATED_TOPIC: orders.created
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          envFrom:
            - configMapRef:
                name: kafka-client-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/notification-worker:1.0.0
          envFrom:
            - configMapRef:
                name: kafka-client-config
          env:
            - name: KAFKA_CONSUMER_GROUP
              value: notification-worker
