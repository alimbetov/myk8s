apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-api
spec:
  gatewayClassName: replace-with-installed-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: api.example.kz
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-route
spec:
  parentRefs:
    - name: public-api
      sectionName: http
  hostnames:
    - api.example.kz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      backendRefs:
        - name: orders-api
          port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-api
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/customer-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: customer-api
spec:
  selector:
    app: customer-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customer-route
spec:
  parentRefs:
    - name: public-api
      sectionName: http
  hostnames:
    - api.example.kz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /customers
      backendRefs:
        - name: customer-api
          port: 8080
