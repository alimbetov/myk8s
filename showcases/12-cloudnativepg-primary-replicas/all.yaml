# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Requires CloudNativePG operator/CRDs.
# IMPORTANT:
# - Applications connect through orders-db-rw / orders-db-ro logical Services.
# - Do not hardcode the current primary Pod.
# - Replication is NOT backup; production needs backup/PITR/restore tests.

apiVersion: v1
kind: Secret
metadata:
  name: orders-db-app
type: kubernetes.io/basic-auth
stringData:
  username: orders_app
  password: replace-at-deploy-time
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db
spec:
  instances: 3

  bootstrap:
    initdb:
      database: orders
      owner: orders_app
      secret:
        name: orders-db-app

  storage:
    size: 20Gi

  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-db-config
data:
  DB_URL: jdbc:postgresql://orders-db-rw:5432/orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: orders-api-db-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orders-db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db-app
                  key: password
# CloudNativePG creates orders-db-rw / orders-db-ro / orders-db Services.
