# Write workload
spring:
  datasource:
    url: jdbc:postgresql://orders-db-rw:5432/orders
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

