# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Kubernetes CronJob owns scheduling; Job owns retries/deadline; Spring Batch owns batch semantics.
# IMPORTANT:
# - timeZone is explicit for business scheduling.
# - concurrencyPolicy=Forbid prevents overlapping scheduled runs, not every possible duplicate.
# - Batch work must still be idempotent/restartable.

apiVersion: v1
kind: ConfigMap
metadata:
  name: reconciliation-config
data:
  SPRING_PROFILES_ACTIVE: batch
  BUSINESS_TIME_ZONE: Asia/Almaty
  DB_URL: jdbc:postgresql://postgres-rw:5432/billing
---
apiVersion: v1
kind: Secret
metadata:
  name: reconciliation-secret
type: Opaque
stringData:
  DB_USERNAME: batch_app
  DB_PASSWORD: replace-at-deploy-time
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-reconciliation
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Almaty
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: daily-reconciliation
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: batch
              image: ghcr.io/example/reconciliation:1.0.0
              envFrom:
                - configMapRef:
                    name: reconciliation-config
                - secretRef:
                    name: reconciliation-secret
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  memory: 1Gi
