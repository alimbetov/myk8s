# ============================================================
# SHOWCASE 13 — SPRING BOOT + S3-COMPATIBLE OBJECT STORAGE
# ============================================================
#
# Spring Boot
#    |
#    | S3 API
#    v
# object storage
#
# DB separately stores metadata:
# key, filename, checksum, expiresAt, status...
#
# ВАЖНО:
# PostgreSQL transaction и S3 object write НЕ одна ACID transaction.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: file-api-storage
data:
  # Non-secret endpoint/configuration.
  S3_ENDPOINT: http://object-storage:9000
  S3_REGION: us-east-1
  S3_BUCKET: uploads
---
apiVersion: v1
kind: Secret
metadata:
  name: file-api-storage
type: Opaque
stringData:
  # Credentials отдельно от ConfigMap.
  S3_ACCESS_KEY: replace-at-deploy-time
  S3_SECRET_KEY: replace-at-deploy-time
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-api
spec:
  replicas: 3

  selector:
    matchLabels:
      app: file-api

  template:
    metadata:
      labels:
        app: file-api

    spec:
      automountServiceAccountToken: false

      containers:
        - name: app
          image: ghcr.io/example/file-api:1.0.0

          envFrom:
            - configMapRef:
                name: file-api-storage
            - secretRef:
                name: file-api-storage

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi

# object-storage cluster/Service intentionally external to this showcase.
#
# APPLICATION CONSISTENCY PATTERN:
#
# DB row PENDING
#   -> upload object
#   -> verify/checksum
#   -> DB row READY
#
# Failure after upload but before READY => orphan cleanup needed.
#
# Для больших uploads production часто использует presigned URL:
# browser -> Spring authorization -> presigned URL -> direct S3 upload.
