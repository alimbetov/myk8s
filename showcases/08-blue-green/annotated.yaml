# ============================================================
# SHOWCASE 08 — BLUE/GREEN DEPLOYMENT
# ============================================================
#
#                  Service orders
#                       |
#                selector color=blue
#                       |
#                       v
#                  blue Pods
#
# Green живёт параллельно и проверяется отдельно.
#
# Cutover = изменить Service.selector blue -> green.
#
# ВАЖНО:
# selector только app=orders смешает blue и green!
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-blue
spec:
  replicas: 3

  selector:
    matchLabels:
      app: orders
      color: blue

  template:
    metadata:
      labels:
        # app = stable application identity
        app: orders
        # color = deployment slot
        color: blue

    spec:
      containers:
        - name: app
          image: ghcr.io/example/orders:1.0.0

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-green
spec:
  replicas: 3

  selector:
    matchLabels:
      app: orders
      color: green

  template:
    metadata:
      labels:
        app: orders
        color: green

    spec:
      containers:
        - name: app
          image: ghcr.io/example/orders:1.1.0

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector:
    app: orders

    # ЭТО ПОЛЕ И ЕСТЬ SWITCH.
    # Пока production = blue.
    color: blue

  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: orders-green-preview
spec:
  # Preview Service всегда выбирает green.
  # Его удобно использовать для smoke tests до cutover.
  selector:
    app: orders
    color: green

  ports:
    - name: http
      port: 8080
      targetPort: http

# CUTOVER:
#
# kubectl patch svc orders #   -p '{"spec":{"selector":{"app":"orders","color":"green"}}}'
#
# ROLLBACK:
#
# kubectl patch svc orders #   -p '{"spec":{"selector":{"app":"orders","color":"blue"}}}'
#
# ОСТОРОЖНО:
# Service switch не откатывает DB schema/events/external side effects.
