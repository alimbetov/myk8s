# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Demonstrates cross-resource coupling: CPU request -> HPA, replicas -> Hikari -> DB capacity.
# IMPORTANT:
# - default-deny egress also blocks DNS unless explicitly allowed.
# - HPA maxReplicas must be checked against PostgreSQL connection capacity.
# - Database availability should not be used as a naive liveness dependency.

apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-api-config
data:
  DB_URL: jdbc:postgresql://postgres-rw:5432/orders
  DB_POOL_SIZE: "10"
  PAYMENT_API_URL: http://payment-api:8080
  PAYMENT_CONNECT_TIMEOUT: 1s
  PAYMENT_READ_TIMEOUT: 3s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-api-secret
type: Opaque
stringData:
  DB_USERNAME: orders_app
  DB_PASSWORD: replace-at-deploy-time
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-api-config
            - secretRef:
                name: orders-api-secret
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-default-deny-egress
spec:
  podSelector:
    matchLabels:
      app: orders-api
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-api-allow-postgres
spec:
  podSelector:
    matchLabels:
      app: orders-api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
# DNS allow intentionally not hardcoded here because CoreDNS labels/IP vary by cluster.
# Build the DNS rule after inspecting the actual k3s/CNI deployment.
