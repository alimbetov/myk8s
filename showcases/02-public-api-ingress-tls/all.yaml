# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Public API through Ingress + TLS, while backend Service remains ClusterIP.
# IMPORTANT:
# - ingressClassName must match the installed controller.
# - TLS Secret/certificate must match the hostname.
# - Ingress backend points to a Service, not directly to Pods.

apiVersion: v1
kind: Secret
metadata:
  name: api-example-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    REPLACE_WITH_CERTIFICATE
  tls.key: |
    REPLACE_WITH_PRIVATE_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 3
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 20s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app.kubernetes.io/name: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-api
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.example.kz
      secretName: api-example-tls
  rules:
    - host: api.example.kz
      http:
        paths:
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  name: http
