# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Baseline internal Spring Boot API.
# IMPORTANT:
# - Service.selector must match Pod labels.
# - Service.targetPort should match the named container port.
# - readiness controls whether the Pod appears as a ready Service endpoint.
# - ConfigMap is for non-secret config; Secret is for credentials.

apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-api-config
data:
  SPRING_PROFILES_ACTIVE: k8s
  DB_URL: jdbc:postgresql://postgres-rw:5432/customer
  CUSTOMER_CACHE_TTL: 60s
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ADD_ADDITIONAL_PATHS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: customer-api-secret
type: Opaque
stringData:
  DB_USERNAME: customer_app
  DB_PASSWORD: replace-at-deploy-time
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-api
    spec:
      serviceAccountName: customer-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/example/customer-api:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: customer-api-config
            - secretRef:
                name: customer-api-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: customer-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: customer-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
