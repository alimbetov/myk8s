# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# File worker mounts persistent storage through a PVC.
# IMPORTANT:
# - ReadWriteOncePod intentionally constrains this example to one writer Pod.
# - Pod deletion does not delete the PVC, but PVC persistence is not a backup.
# - Verify StorageClass/CSI support before using RWOP in your cluster.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: work-data
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 10Gi
  # storageClassName intentionally omitted:
  # the cluster default StorageClass will be used if one exists.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: file-worker-config
data:
  WORK_DIRECTORY: /data/work
  CLEANUP_AFTER: 24h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-worker
  template:
    metadata:
      labels:
        app: file-worker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/example/file-worker:1.0.0
          envFrom:
            - configMapRef:
                name: file-worker-config
          volumeMounts:
            - name: work
              mountPath: /data/work
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: work-data
