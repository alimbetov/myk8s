# ============================================================
# SHOWCASE 06 — SERVICE-TO-SERVICE SECURITY
# ============================================================
#
# orders-api
#    |
#    | DNS + TCP
#    | NetworkPolicy allows reachability
#    | OAuth2/JWT authenticates caller
#    v
# payment-api
#
# НЕ ПУТАТЬ:
# NetworkPolicy = network reachability
# JWT           = application authentication
# RBAC          = Kubernetes API permissions
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
data:
  PAYMENT_API_URL: http://payment-api:8080
  PAYMENT_CONNECT_TIMEOUT: 1s
  PAYMENT_READ_TIMEOUT: 3s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
data:
  # Payment API будет валидировать JWT относительно issuer.
  OIDC_ISSUER_URI: https://identity.example.kz/realms/apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        # Этот label используется NetworkPolicy как caller selector.
        app: orders-api

    spec:
      automountServiceAccountToken: false

      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0

          envFrom:
            - configMapRef:
                name: orders-config

          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-api

  template:
    metadata:
      labels:
        # Target label для NetworkPolicy.
        app: payment-api

    spec:
      automountServiceAccountToken: false

      containers:
        - name: app
          image: ghcr.io/example/payment-api:1.0.0

          envFrom:
            - configMapRef:
                name: payment-config

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  selector:
    app: payment-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-api-ingress
spec:
  # Policy применяется к payment-api Pods.
  podSelector:
    matchLabels:
      app: payment-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            # Разрешаем traffic только от Pods orders-api
            # в этом namespace.
            #
            # ОСТОРОЖНО:
            # label не является cryptographic identity.
            matchLabels:
              app: orders-api

      ports:
        - protocol: TCP
          port: 8080

# RESULT:
# 1) packet может дойти до payment-api:8080
# 2) затем Spring Security отдельно решает 401/403
