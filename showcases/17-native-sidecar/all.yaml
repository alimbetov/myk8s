# EDUCATIONAL PRODUCTION-LIKE EXAMPLE
# Native sidecar uses initContainers[].restartPolicy=Always.
# IMPORTANT:
# - Sidecar and app share Pod network namespace, so localhost works between them.
# - Sidecar consumes real CPU/memory and participates in workload failure/lifecycle.
# - Use a sidecar only when both processes should scale/deploy as one workload unit.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      automountServiceAccountToken: false

      initContainers:
        - name: telemetry-agent
          image: ghcr.io/example/telemetry-agent:1.0.0
          restartPolicy: Always
          ports:
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://127.0.0.1:4318
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi
