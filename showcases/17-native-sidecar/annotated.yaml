# ============================================================
# SHOWCASE 17 — NATIVE KUBERNETES SIDECAR
# ============================================================
#
# One Pod
#   |
#   +--> telemetry-agent :4318
#   |
#   +--> Spring Boot app
#          |
#          +--> http://127.0.0.1:4318
#
# Containers share Pod network namespace.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        app: orders-api

    spec:
      automountServiceAccountToken: false

      initContainers:
        - name: telemetry-agent
          image: ghcr.io/example/telemetry-agent:1.0.0

          # THIS makes it a native sidecar.
          # It starts in init sequence but continues running.
          restartPolicy: Always

          ports:
            - name: otlp-http
              containerPort: 4318

          readinessProbe:
            tcpSocket:
              port: otlp-http

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      containers:
        - name: app
          image: ghcr.io/example/orders-api:1.0.0

          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT

              # localhost works because sidecar is inside SAME Pod.
              value: http://127.0.0.1:4318

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 768Mi

# PRODUCTION ATTENTION:
#
# Sidecar resources are real resources.
# App + sidecar share scheduling/failure lifecycle.
#
# Если процессы должны independently scale/deploy,
# они не должны быть sidecars друг другу.
