apiVersion: v1
kind: Service
metadata:
  name: cluster-member
spec:
  clusterIP: None
  selector:
    app: cluster-member
  ports:
    - name: peer
      port: 9000
      targetPort: peer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cluster-member
spec:
  serviceName: cluster-member
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: cluster-member
  template:
    metadata:
      labels:
        app: cluster-member
    spec:
      automountServiceAccountToken: false
      containers:
        - name: member
          image: ghcr.io/example/cluster-member:1.0.0
          ports:
            - name: peer
              containerPort: 9000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data
              mountPath: /var/lib/member
          readinessProbe:
            tcpSocket:
              port: peer
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
